# Headline 7 × 2 ablation matrix (spec §6.2)
# Each cell runs under both LLM regimes (open-source vs frontier).
# Cost-budget the frontier path up front (§13 caveat 4).

llm_regimes:
  - name: open_source
    primary: chronogpt
    model_family: manelalab/chrono-gpt-instruct-v1
    # Yearly dated checkpoints {1999..2024}; commit shas pinned in
    # llm/chronogpt_revisions.py::INSTRUCT_REVISIONS. For a backtest decision
    # at date D, use cutoff = year(D) - 1 (contamination-clean per spec §6.1).
    cutoff_year_default: 2024
    revisions_module: llm.chronogpt_revisions
    note: "contamination-clean path; per-year checkpoint with pinned sha"
  - name: frontier
    primary: claude
    model: claude-sonnet-5-5
    note: "training data cover the whole 2022-2024 window; treat LLM cells as potentially contaminated"

protocols:
  - id: "1"
    key: single_agent
    name: "Single-LLM monolith"
  - id: "2"
    key: independent_ensemble
    name: "Independent ensemble (no comm)"
  - id: "3"
    key: sequential_pipeline
    name: "Sequential 3-phase pipeline"
  - id: "4"
    key: hierarchical
    name: "Hierarchical / manager-analyst"
  - id: "5"
    key: debate
    name: "Debate / bull-bear"
  - id: "6"
    key: deterministic_only
    name: "Deterministic anchor only"
  - id: "7"
    key: llm_plus_anchor
    name: "LLM + deterministic anchor"

window_a:           # spec §6.4: full window
  start: "2010-01-01"
  end:   "2024-12-31"
  alt_data: false   # WITHOUT Polymarket
window_b:           # spec §6.4: modern window
  start: "2022-01-01"
  end:   "2024-12-31"
  alt_data: true    # WITH Polymarket

walk_forward:
  train_years: 3
  test_months: 6

backtest:
  rebalance_freq: "W-FRI"
  transaction_cost_bps_roundtrip: 30
  starting_capital: 1_000_000
