# Alt-data ablation -- 4 variants, run within the sequential pipeline and debate.
# Polymarket event probabilities are excluded: the Gamma tag filter is ignored by the
# API and the price-history call needs CLOB token ids, so the fetcher does not return
# usable histories for the 2022-2024 window. Re-add once data/fetchers/polymarket.py is fixed.

variants:
  - id: text_only
    name: "Text and macro only"
    enable_secondary: []
    note: "GDELT + ALFRED + EIA + prices"
  - id: plus_attention
    name: "+ Attention data"
    enable_secondary:
      - wiki_abnormal_attention
      - wiki_attention_persistence
      - gtrends_abnormal_level
      - gtrends_momentum
  - id: plus_instrument
    name: "+ Instrument-specific (GitHub QQQ, on-chain BTC, NOAA oil)"
    enable_altdata_in_fundamentals: true
  - id: full
    name: "Attention + instrument-specific"
    enable_secondary:
      - wiki_abnormal_attention
      - wiki_attention_persistence
      - gtrends_abnormal_level
      - gtrends_momentum
    enable_altdata_in_fundamentals: true
