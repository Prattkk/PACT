[project]
name = "pact"
version = "0.0.1"
description = "PACT — Protocols for Agent Coordination in Trading: a coordination-and-attribution harness for multi-agent LLM trading systems."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "arch>=7.0",
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "requests>=2.31",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyarrow>=15.0",
    "tabulate>=0.9",
    "google-cloud-bigquery>=3.20",
    "db-dtypes>=1.0",
    "pytrends>=4.9",
    "openai>=1.40",
    "transformers>=4.44",
    "torch>=2.3",
    "huggingface-hub>=0.24",
    "vectorbt>=0.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]
altdata = [
    "pytrends>=4.9",
    "google-cloud-bigquery>=3.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "coordination",
    "llm",
    "data",
    "factors",
    "portfolio",
    "backtest",
    "evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
